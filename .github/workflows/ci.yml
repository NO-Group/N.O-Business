# N.O Business continuous integration.
#
# The workflow only wires jobs, secrets and artifacts. Every command lives in
# ci/ so the same checks run locally (see README.md -> "Checks").

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, N.O-Business, "arena/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply migrations and run the SQL suite
        run: bash ci/check-db.sh

  app:
    name: App format, analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # used only by the formatting step below
    steps:
      - uses: actions/checkout@v6
      # Agent working branches are written without a local Flutter SDK, so the
      # formatter runs here and its result is committed back. Every other
      # branch and every pull request gets the strict check only.
      - name: Apply formatting (working branches)
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'arena/') }}
        run: bash ci/apply-format.sh
      - name: Formatting
        run: bash ci/check-app.sh format
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: bash ci/check-app.sh analyze
      - name: Tests
        if: ${{ !cancelled() }}
        run: bash ci/check-app.sh test

  android:
    name: Android build
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Build APK
        run: bash ci/build-android.sh
        env:
          NOB_SUPABASE_URL: ${{ secrets.NOB_SUPABASE_URL }}
          NOB_SUPABASE_ANON_KEY: ${{ secrets.NOB_SUPABASE_ANON_KEY }}
          NOB_ANDROID_KEYSTORE_BASE64: ${{ secrets.NOB_ANDROID_KEYSTORE_BASE64 }}
          NOB_SIGNING_PASSWORD: ${{ secrets.NOB_SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: no-business-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows build
    needs: app
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Build portable folder and installer
        shell: pwsh
        run: ./ci/build-windows.ps1
        env:
          NOB_SUPABASE_URL: ${{ secrets.NOB_SUPABASE_URL }}
          NOB_SUPABASE_ANON_KEY: ${{ secrets.NOB_SUPABASE_ANON_KEY }}
          NOB_WINDOWS_PFX_BASE64: ${{ secrets.NOB_WINDOWS_PFX_BASE64 }}
          NOB_SIGNING_PASSWORD: ${{ secrets.NOB_SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: no-business-windows
          path: |
            dist/*.zip
            dist/*.msix
          if-no-files-found: error
