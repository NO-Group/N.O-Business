name: no_business
description: "N.O Business — business management and revenue operations platform by N.O Group."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0       # Auth, Data API (PostgREST) and Storage client
  flutter_riverpod: ^3.0.0        # state management + dependency injection
  go_router: ^17.0.0              # declarative routing with auth-aware redirects
  intl: ^0.20.2                   # currency, number and date formatting
  flutter_secure_storage: ^11.0.0 # session + preferences in the OS credential store
  file_picker: ^13.0.0            # choose files to upload / where to save downloads
  pdf: ^3.11.0                    # quotation and invoice PDFs
  printing: ^5.14.0               # print / share generated PDFs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.7                   # Windows installer packaging (CI)

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

# Windows installer. CI builds the Release folder first (with the backend
# --dart-define values) and then packages exactly that folder.
msix_config:
  display_name: N.O Business
  publisher_display_name: N.O Group
  publisher: CN=N.O Group
  identity_name: com.nogroup.business
  msix_version: 1.0.0.0
  logo_path: assets/brand/logo.png
  capabilities: internetClient
  output_path: build\windows\x64\runner\Release
  output_name: NO-Business-Setup
  build_windows: false
  install_certificate: false
