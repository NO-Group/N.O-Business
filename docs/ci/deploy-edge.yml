# ============================================================================
# M-TEK — deploy the data-api Edge Function to Supabase AUTOMATICALLY.
#
# SNAPSHOT of .github/workflows/deploy-edge.yml (the authoritative file).
# Kept byte-for-byte in sync apart from the branch filter. Do NOT copy only
# part of this file: the SQL bootstrap step is REQUIRED — without it the
# function has no mtek_docs table and every data route fails.
#
# One-time setup (dashboard clicks only — NO bash):
#   1. Use .github/workflows/deploy-edge.yml (authoritative) as-is.
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret:
#        SUPABASE_ACCESS_TOKEN  → Supabase dashboard → Account → Access Tokens
#        SUPABASE_PROJECT_ID    → Supabase dashboard → Project Settings →
#                                 General → Reference ID (kshuadjcflwlidupnqly)
#   3. NO Edge Function secrets to add. The runtime injects SUPABASE_URL and
#      SUPABASE_SERVICE_ROLE_KEY; all data lives in this project's Postgres.
#      (MONGODB_URI / SUPABASE_SECRET_KEY are NO LONGER used — MongoDB was
#      retired 2026-11-04 after its Atlas SRV host disappeared from DNS.)
#   4. Push (or run this workflow) → SQL bootstrap + function go live:
#        https://kshuadjcflwlidupnqly.supabase.co/functions/v1/data-api/health
# ============================================================================
name: Deploy Edge Function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/migrations/**', 'tools/**', '.github/workflows/deploy-edge.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the deploy log back for remote diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the Supabase-Postgres shim contract
        run: |
          set -euo pipefail
          # 53 offline assertions cover every Mongo operator the route
          # handlers use, plus the atomic serial allocator. No DB needed.
          node --experimental-strip-types tools/pg_shim_test.mjs
          # Exhaustive cross-reference gate: the 50-route contract, client
          # paths, response keys, collections, SQL RPCs/grants, operators,
          # versions, dart-defines and CI gates. Fails on ANY drift.
          python3 tools/contract_audit.py
          if grep -q "npm:mongodb" supabase/functions/data-api/index.ts; then
            echo "::error::data-api still imports the MongoDB driver"; exit 1
          fi
          if grep -q "Deno.env.get('MONGODB_URI')" supabase/functions/data-api/index.ts; then
            echo "::error::data-api still reads MONGODB_URI"; exit 1
          fi
          echo "Postgres-only shim verified"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Provision Postgres storage, remove obsolete Auth triggers, verify
        run: |
          set -euo pipefail
          # Creates public.mtek_docs + mtek_next_serial() (the ONLY data
          # store now), removes every user-defined auth.users trigger, then
          # requires the SQL result to prove the provisioning and that zero
          # triggers remain. Never mask this as a successful deployment.
          SQL=$(cat supabase/migrations/20260908160000_remove_auth_profile_trigger.sql)
          HTTP=$(curl -sS -o /tmp/sql.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg query "$SQL" '{query:$query}')")
          BODY=$(tr '\n' ' ' < /tmp/sql.json | head -c 4000)
          echo "Management API HTTP $HTTP: $BODY"
          if ! test "$HTTP" -ge 200 -a "$HTTP" -lt 300; then
            echo "::error::Auth trigger repair HTTP $HTTP: $BODY"
            exit 1
          fi
          if ! jq -e '.. | objects | select(has("verified")) | .verified == true and .auth_users_user_triggers == 0 and .mtek_docs_ready == true and .mtek_next_serial_ready == true and .mtek_cas_ready == true and .mtek_rpc_ready == true' /tmp/sql.json >/dev/null; then
            echo "::error::Postgres storage / trigger repair was not verified: $BODY"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy data-api function
        run: |
          set +e
          # Update the one existing production function in place. Never delete
          # it or create numbered replacement functions. --yes is required by
          # Supabase CLI 3.x: without it the CLI demands an interactive
          # confirmation and aborts with "Nothing was changed" on CI.
          echo "--- UPDATE existing data-api via CLI ---"
          supabase functions deploy data-api --no-verify-jwt --yes --project-ref "$SUPABASE_PROJECT_ID" --debug > /tmp/deploy.log 2>&1
          CODE=$?
          set -e
          echo "supabase functions deploy exit code: $CODE"
          grep -E "No change|Deployed|error|Error" /tmp/deploy.log | tail -6
          # "No change found" is valid: this workflow updates the one existing
          # data-api function in place and never deletes/recreates it.
          exit $CODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # VERIFY the deploy actually landed: /health must return ok:true AND
      # the bundle version baked into index.ts. A past deploy "succeeded"
      # while the project kept serving a stale bundle, which made every new
      # route answer "Unknown API route" — this check makes that visible.
      - name: Verify live bundle version
        run: |
          set -euo pipefail
          WANT='2026-09-19-office-suite1'
          BODY=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/h.json -w '%{http_code}' -A 'mtek-ci-check' "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/data-api/health?deep=1&full=1&poll=${GITHUB_RUN_ID}-$i" || true)
            BODY=$(cat /tmp/h.json 2>/dev/null || true)
            echo "try $i (HTTP $CODE): ${BODY:0:160}"
            case "$BODY" in
              *cloudflare*|*"Just a moment"*|*challenge*) echo "::error::CDN challenge — runner IP blocked from supabase.co"; break;;
            esac
            echo "$BODY" | grep -q "\"version\":\"$WANT\"" && break
            sleep 6
          done
          echo "final /health: $BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "::error::/health never returned ok:true — last body: ${BODY:0:120}"; exit 1; }
          echo "$BODY" | grep -q "\"version\":\"$WANT\"" || { echo "::error::live bundle version is NOT $WANT — last body: ${BODY:0:120}"; exit 1; }
          # The version marker is unchanged by the Supabase-only migration,
          # so also require the new storage marker. This stops a stale
          # MongoDB bundle from ever passing verification again.
          echo "$BODY" | grep -q '"storage":"supabase-postgres"' || { echo "::error::live bundle is still the MongoDB build — last body: ${BODY:0:120}"; exit 1; }
          # Prove the authoritative server serial allocator is callable, so
          # documents can never fall back to a device/local serial.
          echo "$BODY" | grep -q '"serial_rpc":"ok"' || { echo "::error::server serial allocator is not working — last body: ${BODY:0:120}"; exit 1; }
          # Exercise insert/read/update/filter/delete against real Postgres.
          echo "$BODY" | grep -q '"storage_roundtrip":"ok"' || { echo "::error::Postgres CRUD round-trip failed — last body: ${BODY:0:160}"; exit 1; }
          # The public app-version marker drives the in-app updater. It must
          # match app/pubspec.yaml or installed builds would be told about the
          # wrong release (the repo is private, so /health carries it).
          WANT_APP="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | tr -d '\r' | head -1)"
          echo "$BODY" | grep -qF "\"app_version\":\"$WANT_APP\"" || { echo "::error::live app_version is not $WANT_APP — last body: ${BODY:0:200}"; exit 1; }
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # The owner's original symptom was "Document NOT issued". Health checks
      # cannot prove the protected routes work, so exercise the whole flow
      # with a REAL Supabase JWT: signup -> bootstrap -> product write ->
      # server-serial document issuance -> idempotent re-issue -> history.
      # A throwaway account is created and removed in the same step, and the
      # receipt counter is restored afterwards.
      - name: Authenticated end-to-end smoke test (real JWT)
        run: |
          set -euo pipefail
          API="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/data-api"
          MARK="CI-SMOKE-${GITHUB_RUN_ID}"
          EMAIL="mtek-smoke-${GITHUB_RUN_ID}@example.invalid"
          PHOTO='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
          sql() {
            curl -sS -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
              --data "$(jq -n --arg query "$1" '{query:$query}')"
          }
          fail() { echo "::error::$1"; exit 1; }
          record() { echo "$1" | tee -a /tmp/smoke.log >/dev/null; }
          get() { curl -sS -H "Authorization: Bearer $TOKEN" "$API$1"; }
          post() { curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$2" "$API$1"; }

          record "=== authenticated E2E smoke test ${MARK} ==="
          # One-time repair: the FIRST exhaustive sweep probed POST /api/mils
          # with {}, which consumed one server serial without creating a real
          # document (the row was removed by cleanup). While the MILS 'logs'
          # collection is empty, a non-zero counter is a phantom. The probe is
          # now skipped by the contract, so this can only ever fire once.
          sql "update public.mtek_docs set doc = jsonb_set(doc, '{last_used}', '0'::jsonb) where collection='serials' and id='mils' and not exists (select 1 from public.mtek_docs where collection='logs');" >/dev/null || true
          BEFORE=$(curl -sS "$API/health?deep=1")
          SERIALS_BEFORE=$(echo "$BEFORE" | jq -c '.serials')
          RECEIPT_BEFORE=$(echo "$BEFORE" | jq -r '.serials.receipt // 0')
          RECEIPT_ISSUE_BEFORE=$(echo "$BEFORE" | jq -r '.serials.receiptIssue // 0')
          record "serials before: receipt=${RECEIPT_BEFORE} receiptIssue=${RECEIPT_ISSUE_BEFORE}"

          SIGNUP=$(curl -sS -X POST "$API/api/auth/signup" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg e "$EMAIL" --arg p "$PHOTO" \
              '{name:"CI Smoke Test",email:$e,phone:"+2348000000001",password:"SmokeTest2026!",recovery_string:"ci automated smoke recovery phrase",passport_photo:$p}')")
          TOKEN=$(echo "$SIGNUP" | jq -r '.access_token // empty')
          SMOKE_UID=$(echo "$SIGNUP" | jq -r '.user.uid // empty')
          [ -n "$TOKEN" ] && [ -n "$SMOKE_UID" ] || fail "signup failed: ${SIGNUP:0:400}"
          record "signup OK uid=${SMOKE_UID}"

          # signup does NOT warm auth()'s profile cache, so the first
          # authenticated request reads this promoted role.
          sql "update public.mtek_docs set doc = doc || jsonb_build_object('role','ceo') where collection='profiles' and doc->>'email'='$EMAIL';" >/dev/null \
            || fail "could not promote the smoke account"

          BOOT=$(get /api/bootstrap)
          echo "$BOOT" | jq -e '.user.uid and has("products") and has("customers") and has("settings") and has("serials")' >/dev/null \
            || fail "bootstrap failed: ${BOOT:0:400}"
          record "GET /api/bootstrap OK"

          ME=$(get /api/me)
          echo "$ME" | jq -e --arg u "$SMOKE_UID" '.user.uid == $u and .user.role == "ceo"' >/dev/null \
            || fail "GET /api/me failed: ${ME:0:300}"
          record "GET /api/me OK (role ceo - exercises every management route)"

          UP=$(post /api/products/upsert "$(jq -nc --arg m "$MARK" '{products:[{id:$m,name:("CI Smoke " + $m),cost_price:1,selling_price:2,qty_on_hand:3,reorder_level:0,unit:"unit"}]}')")
          echo "$UP" | jq -e '.ok == true and .upserted == 1' >/dev/null || fail "products/upsert failed: ${UP:0:300}"
          PRODS=$(get /api/products)
          echo "$PRODS" | jq -e --arg m "$MARK" 'any(.products[]; ._id == $m)' >/dev/null \
            || fail "product not readable back: ${PRODS:0:400}"
          record "POST /api/products/upsert + GET /api/products OK"

          # Idempotent invoice payment: ApiClient replays a POST once after a
          # 401/token refresh, so a replay must NOT charge the invoice twice.
          INV_NO="CI-SMOKE-INV-${GITHUB_RUN_ID}"
          sql "insert into public.mtek_docs(collection,id,doc) values ('invoices','${INV_NO}', jsonb_build_object('_id','${INV_NO}','no','${INV_NO}','total',1000,'amount_paid',0,'customer_name','CI Smoke','status','unpaid')) on conflict do nothing;" >/dev/null \
            || fail "could not seed the test invoice"
          PAY_BODY="{\"no\":\"${INV_NO}\",\"amount\":400,\"method\":\"transfer\",\"issue_key\":\"${MARK}-pay\"}"
          PAY1=$(post /api/invoices/pay "$PAY_BODY")
          echo "$PAY1" | jq -e '.ok == true and (.receipt_no | length > 0)' >/dev/null \
            || fail "invoice payment failed: ${PAY1:0:400}"
          PAY2=$(post /api/invoices/pay "$PAY_BODY")
          echo "$PAY2" | jq -e '.ok == true and .duplicate == true' >/dev/null \
            || fail "invoice payment replay was not idempotent: ${PAY2:0:400}"
          BOOT3=$(get /api/bootstrap)
          echo "$BOOT3" | jq -e --arg inv "$INV_NO" 'any(.invoices[]; .no == $inv and (.amount_paid | tonumber) == 400)' >/dev/null \
            || fail "invoice balance wrong after replay: ${BOOT3:0:400}"
          record "POST /api/invoices/pay is idempotent (one 400 payment, not 800)"

          ISSUE=$(post /api/docs/issue "$(jq -nc --arg m "$MARK" '{type:"receipt",customer:$m,contact:"+2348000000001",total:1,hash:"ci-smoke",issue_key:$m}')")
          echo "$ISSUE" | jq -e '.serial > 0 and .doc.serial == .serial and .doc.doc_type == "receipt"' >/dev/null \
            || fail "DOCUMENT ISSUE FAILED: ${ISSUE:0:500}"
          SERIAL=$(echo "$ISSUE" | jq -r '.serial')
          record "POST /api/docs/issue OK -> server serial ${SERIAL}"

          AGAIN=$(post /api/docs/issue "$(jq -nc --arg m "$MARK" '{type:"receipt",customer:$m,contact:"+2348000000001",total:1,hash:"ci-smoke",issue_key:$m}')")
          echo "$AGAIN" | jq -e --argjson s "$SERIAL" '.duplicate == true and .serial == $s' >/dev/null \
            || fail "duplicate issue guard failed: ${AGAIN:0:400}"
          record "repeat issue is idempotent (no second serial consumed)"

          HIST=$(get /api/docs/history)
          echo "$HIST" | jq -e --arg m "$MARK" 'any(.docs[]; .customer == $m)' >/dev/null \
            || fail "issued document not in history: ${HIST:0:400}"
          CHANGES=$(get /api/changes)
          echo "$CHANGES" | jq -e 'has("stamp")' >/dev/null || fail "changes failed: ${CHANGES:0:300}"
          NOTIF=$(get /api/notifications)
          echo "$NOTIF" | jq -e 'has("notifications")' >/dev/null || fail "notifications failed: ${NOTIF:0:300}"
          record "history / changes / notifications OK"

          # ---- exhaustive route sweep: EVERY route in the contract ----------
          # GET routes are read-only and must return their declared keys. POST
          # routes get {} and must be rejected by their input guard; the static
          # gate proves an empty body cannot create a business record (only
          # /api/settings writes an audit event, removed by cleanup below). The
          # single route that mutates ALL notifications is skipped in the
          # manifest and covered by the shim harness instead.
          python3 - <<'SWEEP' > /tmp/route_sweep.tsv
          import json
          for r in json.load(open('tools/api_contract.json'))['routes']:
              m, p = r['route'].split(' ', 1)
              print(m, p + r.get('query', ''), r['probe'], ','.join(r.get('keys', [])), sep='\t')
          SWEEP
          SWEEP_OK=0
          SWEEP_FAIL=0
          SWEEP_SKIP=0
          while IFS=$'\t' read -r M P PROBE KEYS; do
            if [ "$PROBE" = "skip" ]; then SWEEP_SKIP=$((SWEEP_SKIP+1)); continue; fi
            if [ "$M" = "GET" ]; then
              CODE=$(curl -sS -o /tmp/sweep_body -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" "$API$P")
            else
              CODE=$(curl -sS -o /tmp/sweep_body -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                --data '{}' "$API$P")
            fi
            BODY="$(cat /tmp/sweep_body)"
            if ! [[ "$CODE" =~ ^[0-9]{3}$ ]] || [ "$CODE" -ge 500 ]; then
              record "SWEEP FAIL $M $P -> HTTP $CODE ${BODY:0:240}"
              SWEEP_FAIL=$((SWEEP_FAIL+1)); continue
            fi
            if ! echo "$BODY" | jq -e . >/dev/null 2>&1; then
              record "SWEEP FAIL $M $P -> non-JSON ${BODY:0:240}"
              SWEEP_FAIL=$((SWEEP_FAIL+1)); continue
            fi
            if echo "$BODY" | grep -q 'Unknown API route'; then
              record "SWEEP FAIL $M $P -> unknown route"
              SWEEP_FAIL=$((SWEEP_FAIL+1)); continue
            fi
            if [ -n "$KEYS" ]; then
              IFS=',' read -ra WANTED <<< "$KEYS"
              for K in "${WANTED[@]}"; do
                echo "$BODY" | jq -e --arg k "$K" 'type == "object" and has($k)' >/dev/null \
                  || { record "SWEEP FAIL $M $P -> missing key $K"; SWEEP_FAIL=$((SWEEP_FAIL+1)); }
              done
            fi
            SWEEP_OK=$((SWEEP_OK+1))
          done < /tmp/route_sweep.tsv
          record "route sweep: ${SWEEP_OK} routes live-verified, ${SWEEP_FAIL} failed, ${SWEEP_SKIP} intentionally skipped"
          [ "$SWEEP_FAIL" -eq 0 ] || fail "route sweep failed for ${SWEEP_FAIL} route(s)"

          # Regression: a client MUST NOT be able to raise the authoritative
          # serial counters by posting a `serials` map to /api/sync/import.
          # Serials are server-owned; only nextSerial()/CEO reseed may move them.
          SER_BEFORE=$(curl -sS "$API/health?deep=1" | jq -c '.serials')
          POISON=$(post /api/sync/import "$(jq -nc \
            '{device:"CI-SMOKE-SERIAL-PROBE",serials:{invoice:999999,receipt:999999,receiptIssue:999999,mils:999999,waybill:999999,deliverynote:999999,stockreceipt:999999,paymentvoucher:999999}}')")
          echo "$POISON" | jq -e '.ok == true' >/dev/null \
            || fail "sync/import serial probe failed: ${POISON:0:300}"
          SER_AFTER=$(curl -sS "$API/health?deep=1" | jq -c '.serials')
          [ "$SER_BEFORE" = "$SER_AFTER" ] \
            || fail "client serial override changed server counters: ${SER_BEFORE} -> ${SER_AFTER}"
          record "client-supplied serials are ignored (server-owned counters unchanged)"

          # Restore EVERY serial book to its pre-test value, not just the two
          # the smoke test touches: a future route must never leak a counter.
          RESET_SERIALS=""
          while IFS=$'\t' read -r SK SV; do
            [ -z "$SK" ] && continue
            RESET_SERIALS+="update public.mtek_docs set doc = jsonb_set(doc, '{last_used}', to_jsonb(${SV}::integer)) where collection='serials' and id='${SK}'; "
          done < <(echo "$SERIALS_BEFORE" | jq -r 'to_entries[] | [.key, (.value|tostring)] | @tsv')
          CLEAN="delete from public.mtek_docs where doc::text like '%${MARK}%' or doc::text like '%${SMOKE_UID}%' or id='${INV_NO}'; ${RESET_SERIALS}delete from auth.users where email='${EMAIL}';"
          CLEAN_OUT=$(sql "$CLEAN" 2>&1) || true
          record "cleanup: ${CLEAN_OUT:0:400}"
          record "=== authenticated E2E smoke test PASSED ==="
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # TEMPORARY diagnostics: the Actions log host is unreachable from the
      # arena sandbox, so attach the CLI log to the rolling "ci" release
      # instead. Remove once the deploy reliably lands.
      - name: Record deploy log on the ci release
        if: always()
        run: |
          {
            echo "deploy run: $GITHUB_RUN_ID  at: $(date -u '+%Y-%m-%d %H:%M:%SZ')  ref: $GITHUB_REF_NAME  sha: $GITHUB_SHA"
            { echo '--- sql.json ---'; cat /tmp/sql.json 2>/dev/null; echo; echo '--- smoke.log ---'; cat /tmp/smoke.log 2>/dev/null; echo; echo '--- deploy.log ---'; tail -c 24000 /tmp/deploy.log 2>/dev/null; } || echo "(log missing)"
          } > last-edge-deploy.log
          gh release view ci >/dev/null 2>&1 || gh release create ci --prerelease -t "MFSL Office - auto builds (rolling)" -n ci
          gh release upload ci last-edge-deploy.log --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
