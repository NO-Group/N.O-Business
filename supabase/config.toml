# Supabase CLI configuration for N.O Business.
#
# Used by `supabase start` (local stack), `supabase db push` (apply
# migrations) and `supabase config push`. Project-specific values (project
# ref, keys, SMTP credentials) are NOT stored here: link a project with
# `supabase link` and keep secrets in the dashboard or environment variables.
project_id = "no-business"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API. The `app` schema holds the
# authorization helpers and is deliberately not listed.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Upper bound for any bucket; the `documents` bucket sets its own 20 MB limit
# and MIME allow-list in the migrations.
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
# Accounts must prove ownership of the email address before they can accept
# invitations (accept_invitation also checks this in the database).
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_length = 6
otp_expiry = 3600

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
